[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terics"
version = "0.5.0rc2"
description = "Local Chinese university timetable to ICS converter with a Tkinter GUI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "styayur" }]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "openpyxl>=3.1,<4",
  "playwright>=1.55,<2",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.180,<3",
  "keyring>=25,<28"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "icalendar>=6,<8",
  "ruff>=0.9,<1"
]

[project.scripts]
terics = "terics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terics*"]

[tool.setuptools.package-data]
terics = ["assets/*.js", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
