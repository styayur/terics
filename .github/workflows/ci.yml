name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web, Extension and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:connectors
      - run: npm run generate:whut-fixture
      - run: git diff --exit-code -- python/terics/assets/connector-runtime.js python/terics/assets/connector-manifest.json fixtures/exchange/whut-real-shape.terics.json
      - run: npm run check
      - run: npm test
      - run: npm run build:extension
      - run: npm run package:extension
      - run: npm run verify:extension
      - run: npm run audit:licenses
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  python:
    name: Python lint, Playwright and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: python -m compileall -q terics
      - run: python ../scripts/audit_python_licenses.py
      - run: python -m pytest

  consistency:
    name: Web/Python consistency
    runs-on: ubuntu-latest
    needs: [web, python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: npm run test:consistency

  extension-edge:
    name: Windows Edge extension smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - run: npm run package:extension
      - run: npm run verify:extension
      - run: npm run test:extension-install:edge
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: edge-extension-evidence
          path: test-results/
          if-no-files-found: ignore
